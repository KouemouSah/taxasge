# ============================================================================
# Facil Mobile — CI/CD Pipeline (Android)
# ============================================================================
# Production-grade workflow:
#   1. Lint + TypeScript check (fast gate)
#   2. Build release APK (ABI split: arm64 + armv7 + universal)
#   3. Build AAB for Play Store
#   4. Size analysis + regression check
#   5. Upload artifacts (APK + AAB)
#   6. Create GitHub Release on tag push
#
# Triggers:
#   - Push to develop/main with mobile changes
#   - Tags v*.*.* for releases
#   - Manual dispatch
#
# Required Secrets:
#   ANDROID_KEYSTORE_BASE64   — base64-encoded release keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS          — key alias
#   ANDROID_KEY_PASSWORD       — key password
# ============================================================================

name: Mobile CI/CD

on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/mobile/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  WORKING_DIR: packages/mobile

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Gate: Lint + TypeScript
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline

      - name: TypeScript check
        run: cd ${{ env.WORKING_DIR }} && npx tsc --noEmit --pretty

      - name: ESLint
        run: cd ${{ env.WORKING_DIR }} && npx eslint src --ext .ts,.tsx --max-warnings=50 --quiet
        continue-on-error: true  # Don't block build on lint warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Build: Android APK + AAB
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    strategy:
      matrix:
        include:
          - format: apk
            gradle_task: assembleRelease
            output_path: app/build/outputs/apk/release
          - format: aab
            gradle_task: bundleRelease
            output_path: app/build/outputs/bundle/release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('packages/mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline

      - name: Expo prebuild
        run: cd ${{ env.WORKING_DIR }} && npx expo prebuild --platform android --clean --no-install

      - name: Optimize build config (ABI split + ProGuard)
        run: |
          BUILD_GRADLE="${{ env.WORKING_DIR }}/android/app/build.gradle"

          # Inject ABI split config (generates per-arch APKs ~40% smaller)
          sed -i '/buildTypes {/i \
              splits {\
                  abi {\
                      enable true\
                      reset()\
                      include "armeabi-v7a", "arm64-v8a"\
                      universalApk true\
                  }\
              }' "$BUILD_GRADLE"

          # Enable shrinkResources in release (default is false after prebuild)
          sed -i 's/shrinkResources .*/shrinkResources true/' "$BUILD_GRADLE"

          # Use optimized ProGuard rules
          sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/' "$BUILD_GRADLE"

          # Add ProGuard keep rules for Hermes + Expo
          PROGUARD="${{ env.WORKING_DIR }}/android/app/proguard-rules.pro"
          cat >> "$PROGUARD" << 'PGEOF'

          # Hermes
          -keep class com.facebook.hermes.unicode.** { *; }
          -keep class com.facebook.jni.** { *; }
          # Expo
          -keep class expo.modules.** { *; }
          -keepclassmembers class * { @expo.modules.kotlin.* *; }
          # React Native
          -keep,allowobfuscation @interface com.facebook.proguard.annotations.DoNotStrip
          -keep @com.facebook.proguard.annotations.DoNotStrip class *
          -keepclassmembers class * { @com.facebook.proguard.annotations.DoNotStrip *; }
          PGEOF

          echo "Build config optimized"

      - name: Create .env.production
        run: |
          cat > ${{ env.WORKING_DIR }}/.env.production << 'ENVEOF'
          EXPO_PUBLIC_API_URL=https://taxasge-backend-staging-392159428433.us-central1.run.app
          EXPO_PUBLIC_API_TIMEOUT=30000
          EXPO_PUBLIC_FEATURE_BIOMETRIC=true
          EXPO_PUBLIC_FEATURE_PUSH=true
          EXPO_PUBLIC_FEATURE_CHATBOT=true
          ENVEOF

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ env.WORKING_DIR }}/android/app/facil-release.keystore

      - name: Build ${{ matrix.format }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd ${{ env.WORKING_DIR }}/android
          chmod +x gradlew

          GRADLE_PROPS=""
          if [ -f "app/facil-release.keystore" ]; then
            GRADLE_PROPS="-PFACIL_STORE_FILE=facil-release.keystore"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          fi

          ./gradlew ${{ matrix.gradle_task }} \
            --no-daemon \
            --build-cache \
            --parallel \
            --max-workers=2 \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            $GRADLE_PROPS

      - name: Verify output
        id: verify
        run: |
          OUTPUT_DIR="${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}"
          echo "Listing $OUTPUT_DIR:"
          ls -lh "$OUTPUT_DIR/" 2>/dev/null

          if [ "${{ matrix.format }}" = "apk" ]; then
            # Find arm64 APK (primary target)
            ARM64_APK=$(find "$OUTPUT_DIR" -name "*arm64*release*.apk" -o -name "app-arm64-v8a-release.apk" | head -1)
            UNIVERSAL_APK=$(find "$OUTPUT_DIR" -name "*universal*release*.apk" -o -name "app-universal-release.apk" | head -1)

            if [ -n "$ARM64_APK" ]; then
              SIZE=$(du -h "$ARM64_APK" | cut -f1)
              echo "arm64_apk=$ARM64_APK" >> $GITHUB_OUTPUT
              echo "arm64_size=$SIZE" >> $GITHUB_OUTPUT
            fi
            if [ -n "$UNIVERSAL_APK" ]; then
              SIZE=$(du -h "$UNIVERSAL_APK" | cut -f1)
              echo "universal_apk=$UNIVERSAL_APK" >> $GITHUB_OUTPUT
              echo "universal_size=$SIZE" >> $GITHUB_OUTPUT
            fi
          else
            AAB=$(find "$OUTPUT_DIR" -name "*.aab" | head -1)
            if [ -n "$AAB" ]; then
              SIZE=$(du -h "$AAB" | cut -f1)
              echo "aab=$AAB" >> $GITHUB_OUTPUT
              echo "aab_size=$SIZE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload APK artifacts
        if: matrix.format == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: facil-apk-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}/*-release*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload AAB artifact
        if: matrix.format == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: facil-aab-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}/*.aab
          retention-days: 90
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: facil-apk-${{ github.ref_name }}-${{ github.sha }}
          path: apk-output
        continue-on-error: true

      - name: Download AAB artifacts
        uses: actions/download-artifact@v4
        with:
          name: facil-aab-${{ github.ref_name }}-${{ github.sha }}
          path: aab-output
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "## Facil Mobile Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls apk-output/*.apk 1>/dev/null 2>&1; then
            echo "| Variant | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for apk in apk-output/*.apk; do
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No APK artifacts found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AAB (Play Store)" >> $GITHUB_STEP_SUMMARY
          if ls aab-output/*.aab 1>/dev/null 2>&1; then
            for aab in aab-output/*.aab; do
              SIZE=$(du -h "$aab" | cut -f1)
              echo "| \`$(basename "$aab")\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No AAB artifacts found" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Release: create GitHub Release on tag push
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: facil-apk-${{ github.ref_name }}-${{ github.sha }}
          path: release-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: facil-aab-${{ github.ref_name }}-${{ github.sha }}
          path: release-aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Facil Mobile ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release-apk/*.apk
            release-aab/*.aab
