# ============================================================================
# Facil Mobile — CI/CD Pipeline (Android)
# ============================================================================
# Production-grade workflow:
#   1. Lint + TypeScript check (fast gate)
#   2. Build release APK (ABI split: arm64 + armv7 + universal)
#   3. Build AAB for Play Store
#   4. Size analysis + regression check
#   5. Upload artifacts (APK + AAB)
#   6. Create GitHub Release on tag push
#
# Triggers:
#   - Push to develop/main with mobile changes
#   - Tags v*.*.* for releases
#   - Manual dispatch
#
# Required Secrets:
#   ANDROID_KEYSTORE_BASE64   — base64-encoded release keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS          — key alias
#   ANDROID_KEY_PASSWORD       — key password
# ============================================================================

name: Mobile CI/CD

on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/mobile/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  WORKING_DIR: packages/mobile

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Gate: Lint + TypeScript
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline --legacy-peer-deps

      - name: TypeScript check
        run: cd ${{ env.WORKING_DIR }} && npx tsc --noEmit --pretty

      - name: ESLint
        # Threshold aligned with the project memory #35 contract (100 warnings cap).
        # `--quiet` filters output to errors only; the cap still drives the exit code.
        # `continue-on-error: true` keeps the build moving when warnings creep up,
        # but failing strictly on errors is enforced by the cap.
        run: cd ${{ env.WORKING_DIR }} && npx eslint src --ext .ts,.tsx --max-warnings=100
        continue-on-error: true  # Don't block build on lint warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Build: Android APK + AAB
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    strategy:
      matrix:
        include:
          - format: apk
            gradle_task: assembleRelease
            output_path: app/build/outputs/apk/release
          - format: aab
            gradle_task: bundleRelease
            output_path: app/build/outputs/bundle/release

    steps:
      - uses: actions/checkout@v4

      # Sanitize ref_name for artifact naming. PR triggers expose `ref_name`
      # as `<NUMBER>/merge` (with a slash), which GitHub Actions rejects in
      # artifact names. Replace any character outside [A-Za-z0-9._-] with `-`
      # so push, tag and PR triggers all produce valid names.
      - name: Compute safe ref slug
        id: slug
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          # Collapse repeats and trim leading/trailing dashes for cosmetics.
          REF=$(echo "$REF" | sed -E 's/-+/-/g; s/^-//; s/-$//')
          # Fall back to "ref" if everything got stripped (shouldn't happen).
          [ -z "$REF" ] && REF="ref"
          echo "ref_safe=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('packages/mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline --legacy-peer-deps

      # Re-run config plugins (e.g. with-adi-registration) without nuking the
      # committed android/ folder. `--clean` would wipe app/src/main/assets/
      # including adi-registration.properties — Play Store dev verification
      # depends on that file being present in the APK.
      - name: Expo prebuild (no-clean)
        env:
          ADI_REGISTRATION_TOKEN: ${{ secrets.ADI_REGISTRATION_TOKEN }}
        run: cd ${{ env.WORKING_DIR }} && npx expo prebuild --platform android --no-install

      - name: Create .env.production
        run: |
          cat > ${{ env.WORKING_DIR }}/.env.production << 'ENVEOF'
          EXPO_PUBLIC_API_URL=https://taxasge-backend-staging-392159428433.us-central1.run.app
          EXPO_PUBLIC_API_TIMEOUT=30000
          EXPO_PUBLIC_FEATURE_BIOMETRIC=true
          EXPO_PUBLIC_FEATURE_PUSH=true
          EXPO_PUBLIC_FEATURE_CHATBOT=true
          ENVEOF

      # Hard-fail when the keystore secret is missing on a release build.
      # Silently falling back to the debug key (which is what happened on
      # commit 19e54900 — APK signed with FA:C6:17:45:DC:09... instead of
      # the Play Console-registered C4:78:D6:B0:6D:88... key) produces an
      # artifact that looks signed but cannot be uploaded to Play Store.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — release APK would be debug-signed and unusable for Play Store. Set it via 'gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 facil-release.keystore)'."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ env.WORKING_DIR }}/android/app/facil-release.keystore
          # Sanity check: a JKS keystore is at minimum a few KB.
          KS_SIZE=$(stat -c%s "${{ env.WORKING_DIR }}/android/app/facil-release.keystore")
          if [ "$KS_SIZE" -lt 1024 ]; then
            echo "::error::Decoded keystore is suspiciously small ($KS_SIZE bytes) — secret is probably truncated or wrong."
            exit 1
          fi

      - name: Build ${{ matrix.format }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The @sentry/react-native Gradle plugin tries to auto-upload
          # sourcemaps via sentry-cli during the build (since P9.2). It needs
          # SENTRY_AUTH_TOKEN to do so — and we deliberately do NOT expose
          # that secret here because:
          #   1. EAS Build is the canonical channel for production-grade
          #      builds; it has the token in `eas env` (preview + production)
          #      and uploads the sourcemaps from there.
          #   2. GitHub Actions runs as a CI gate (lint / typecheck / build
          #      smoke test). Uploading sourcemaps on every CI commit would
          #      pollute Sentry with noise releases.
          # Setting SENTRY_DISABLE_AUTO_UPLOAD=true tells the plugin to
          # generate the sourcemap files locally but skip the upload, keeping
          # the build green without ever needing the auth token here.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          cd ${{ env.WORKING_DIR }}/android
          chmod +x gradlew

          # Decode-keystore step above already enforces presence + non-empty
          # password vars. Re-check here so a misconfigured passwords/alias
          # (e.g. only KEYSTORE_BASE64 set, ALIAS missing) fails fast instead
          # of producing a debug-signed release APK.
          if [ ! -f "app/facil-release.keystore" ]; then
            echo "::error::facil-release.keystore missing — Decode keystore step likely failed."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing one of ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets — release would silently fall back to debug signing."
            exit 1
          fi
          GRADLE_PROPS="-PFACIL_STORE_FILE=facil-release.keystore"
          GRADLE_PROPS="$GRADLE_PROPS -PFACIL_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_ALIAS=$ANDROID_KEY_ALIAS"
          GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"

          # build.gradle hardcodes `shrinkResources true` for release; that
          # only works when minify is also on, so we must pass
          # enableMinifyInReleaseBuilds=true here. Without it Gradle aborts
          # with "Removing unused resources requires unused code shrinking
          # to be turned on" (regression from commit 310c3be).
          ./gradlew ${{ matrix.gradle_task }} \
            --no-daemon \
            --build-cache \
            --parallel \
            --max-workers=2 \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            $GRADLE_PROPS

      - name: Verify output
        id: verify
        run: |
          OUTPUT_DIR="${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}"
          echo "Listing $OUTPUT_DIR:"
          ls -lh "$OUTPUT_DIR/" 2>/dev/null

          if [ "${{ matrix.format }}" = "apk" ]; then
            # Find arm64 APK (primary target)
            ARM64_APK=$(find "$OUTPUT_DIR" -name "*arm64*release*.apk" -o -name "app-arm64-v8a-release.apk" | head -1)
            UNIVERSAL_APK=$(find "$OUTPUT_DIR" -name "*universal*release*.apk" -o -name "app-universal-release.apk" | head -1)

            if [ -n "$ARM64_APK" ]; then
              SIZE=$(du -h "$ARM64_APK" | cut -f1)
              echo "arm64_apk=$ARM64_APK" >> $GITHUB_OUTPUT
              echo "arm64_size=$SIZE" >> $GITHUB_OUTPUT
            fi
            if [ -n "$UNIVERSAL_APK" ]; then
              SIZE=$(du -h "$UNIVERSAL_APK" | cut -f1)
              echo "universal_apk=$UNIVERSAL_APK" >> $GITHUB_OUTPUT
              echo "universal_size=$SIZE" >> $GITHUB_OUTPUT
            fi
          else
            AAB=$(find "$OUTPUT_DIR" -name "*.aab" | head -1)
            if [ -n "$AAB" ]; then
              SIZE=$(du -h "$AAB" | cut -f1)
              echo "aab=$AAB" >> $GITHUB_OUTPUT
              echo "aab_size=$SIZE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload APK artifacts
        if: matrix.format == 'apk'
        uses: actions/upload-artifact@v7
        with:
          name: facil-apk-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}/*-release*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload AAB artifact
        if: matrix.format == 'aab'
        uses: actions/upload-artifact@v7
        with:
          name: facil-aab-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/${{ matrix.output_path }}/*.aab
          retention-days: 90
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    steps:
      - name: Compute safe ref slug
        id: slug
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          REF=$(echo "$REF" | sed -E 's/-+/-/g; s/^-//; s/-$//')
          [ -z "$REF" ] && REF="ref"
          echo "ref_safe=$REF" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: facil-apk-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: apk-output
        continue-on-error: true

      - name: Download AAB artifacts
        uses: actions/download-artifact@v4
        with:
          name: facil-aab-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: aab-output
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "## Facil Mobile Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls apk-output/*.apk 1>/dev/null 2>&1; then
            echo "| Variant | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for apk in apk-output/*.apk; do
              NAME=$(basename "$apk")
              SIZE=$(du -h "$apk" | cut -f1)
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No APK artifacts found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AAB (Play Store)" >> $GITHUB_STEP_SUMMARY
          if ls aab-output/*.aab 1>/dev/null 2>&1; then
            for aab in aab-output/*.aab; do
              SIZE=$(du -h "$aab" | cut -f1)
              echo "| \`$(basename "$aab")\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No AAB artifacts found" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Release: create GitHub Release on tag push
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute safe ref slug
        id: slug
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          REF=$(echo "$REF" | sed -E 's/-+/-/g; s/^-//; s/-$//')
          [ -z "$REF" ] && REF="ref"
          echo "ref_safe=$REF" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: facil-apk-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: release-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: facil-aab-${{ steps.slug.outputs.ref_safe }}-${{ github.sha }}
          path: release-aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Facil Mobile ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release-apk/*.apk
            release-aab/*.aab
