# ============================================================================
# 📱 Facil Mobile — Build & Deploy (Android)
# ============================================================================
# Triggered on push to develop/main with mobile changes.
# Builds a release APK via Gradle (no EAS queue dependency).
# Uploads APK as GitHub artifact (downloadable from Actions tab).
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64  — base64-encoded facil-release.keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — key alias (facil)
#   ANDROID_KEY_PASSWORD      — key password
# ============================================================================

name: 📱 Mobile Build

on:
  push:
    branches: [develop, main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch: # Manual trigger

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript check (fast gate)
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TS Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/mobile/package-lock.json
      - run: cd packages/mobile && npm ci
      - run: cd packages/mobile && npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────────────────
  # Build release APK
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 Install dependencies
        run: cd packages/mobile && npm ci

      - name: 🔧 Create .env.production
        run: |
          cat > packages/mobile/.env.production << 'EOF'
          EXPO_PUBLIC_API_URL=https://taxasge-backend-staging-392159428433.us-central1.run.app
          EXPO_PUBLIC_API_TIMEOUT=30000
          EXPO_PUBLIC_FEATURE_BIOMETRIC=true
          EXPO_PUBLIC_FEATURE_PUSH=true
          EXPO_PUBLIC_FEATURE_CHATBOT=true
          EOF

      - name: 🔐 Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > packages/mobile/android/app/facil-release.keystore
          echo "✅ Keystore decoded"

      - name: 🏗️ Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd packages/mobile/android
          chmod +x gradlew

          # Pass signing config via Gradle properties
          GRADLE_PROPS=""
          if [ -f "app/facil-release.keystore" ]; then
            GRADLE_PROPS="-PFACIL_STORE_FILE=facil-release.keystore"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            GRADLE_PROPS="$GRADLE_PROPS -PFACIL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "🔐 Using release keystore"
          else
            echo "⚠️ No release keystore — using debug signing"
          fi

          echo "🏗️ Building release APK..."
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            --max-workers=2 \
            $GRADLE_PROPS

          # Verify APK
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK built: $APK_SIZE"
          else
            echo "❌ APK not found"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"
            exit 1
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facil-android-${{ github.ref_name }}-${{ github.sha }}
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Build Summary
        run: |
          APK_PATH="packages/mobile/android/app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "## 📱 Facil Mobile Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`facil-android-${{ github.ref_name }}-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above ⬆️" >> $GITHUB_STEP_SUMMARY
