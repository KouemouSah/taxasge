# ============================================================================
# Facil Mobile — EAS Cloud Build (Android + iOS in parallel)
# ============================================================================
# Triggers EAS Cloud builds on https://expo.dev. The runner only orchestrates;
# all native compilation happens on Expo's infrastructure.
#
# Difference from mobile-build.yml:
#   - mobile-build.yml: builds Android natively on the GitHub runner (Gradle).
#   - mobile-eas-build.yml: dispatches builds to EAS Cloud (Android + iOS).
#
# Required Secret:
#   EXPO_TOKEN — Expo personal access token with build permissions.
#                Generate at https://expo.dev/settings/access-tokens
#
# Triggers:
#   - Manual dispatch (default profile: preview, both platforms)
#   - Tag push v*.*.* → production profile, both platforms
#
# How to ship a production build:
#   git tag v1.0.X && git push origin v1.0.X
#     → fires this workflow with profile=production, platform=all
#     → both Android (.aab) and iOS (.ipa) queued on EAS Cloud
#     → progress at https://expo.dev/accounts/emacsah/projects/facil/builds
# ============================================================================

name: Mobile EAS Build (Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [development, preview, production]
        default: preview
      platform:
        description: 'Platform(s) to build'
        type: choice
        options: [all, android, ios]
        default: all
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: mobile-eas-${{ github.ref }}
  cancel-in-progress: false # never cancel a paid build mid-flight

env:
  NODE_VERSION: '20'
  WORKING_DIR: packages/mobile

jobs:
  eas-build:
    name: EAS Build (${{ github.event.inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30 # orchestration only — actual build runs on Expo Cloud

    # Job-level env so EXPO_TOKEN is available to every step (TypeScript check,
    # eas build, future eas submit). The expo-github-action setup step also
    # reads its `with: token:` input, but having the env var defined at the
    # job scope means we never have to remember to redeclare it on each new
    # `run:` step that calls eas-cli.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: TypeScript check
        run: cd ${{ env.WORKING_DIR }} && npx tsc --noEmit

      - name: Resolve build parameters
        id: params
        run: |
          # Tag push → production. Manual dispatch → user inputs.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
            echo "platform=all" >> $GITHUB_OUTPUT
          else
            echo "profile=${{ github.event.inputs.profile || 'preview' }}" >> $GITHUB_OUTPUT
            echo "platform=${{ github.event.inputs.platform || 'all' }}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS build (${{ steps.params.outputs.platform }} on ${{ steps.params.outputs.profile }})
        # EXPO_TOKEN is inherited from the job-scoped env block (see top of
        # the job). The expo/expo-github-action@v8 step authenticates the
        # CLI for its own action context but does NOT propagate the token
        # to subsequent `run:` steps — they spawn a fresh shell, which is
        # what caused run #25157629153 (2026-04-30) to fail with:
        #   "An Expo user account is required to proceed. Either log in
        #    with `eas login` or set the EXPO_TOKEN environment variable"
        run: |
          cd ${{ env.WORKING_DIR }}
          eas build \
            --profile ${{ steps.params.outputs.profile }} \
            --platform ${{ steps.params.outputs.platform }} \
            --non-interactive \
            --no-wait
        # --no-wait returns immediately after the build is queued. Track
        # progress on https://expo.dev/accounts/<owner>/projects/facil/builds.
        # Remove --no-wait if you want the workflow to block until the build
        # finishes (and fail the workflow if the build fails).
