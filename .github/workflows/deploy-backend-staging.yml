# =============================================================================
# TaxasGE Backend - Cloud Run Staging Deployment
# =============================================================================
# Triggers: Push to develop, manual dispatch
# Service: taxasge-backend-staging on Cloud Run (us-central1)
# =============================================================================

name: Deploy Backend to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch:

env:
  PROJECT_ID: taxasge-dev
  SERVICE_NAME: taxasge-backend-staging
  REGION: us-central1

jobs:
  # Job 1: Pre-deployment tests
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          # Remove problematic Microsoft repositories that can cause 403 errors
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          sudo apt-get update || true
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/test_config.py -v || echo "Tests completed with warnings"

  # Job 2: Build and Deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/backend

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          BUILD_ID=$(gcloud builds submit \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --async \
            --format="value(id)")

          echo "Build ID: $BUILD_ID"
          echo "Waiting for build to complete..."

          # Poll build status every 15 seconds (max 20 min)
          TIMEOUT=1200
          ELAPSED=0
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "[$ELAPSED s] Status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build completed successfully!"
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed: $STATUS"
              echo "Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.PROJECT_ID }}"
              exit 1
            fi

            sleep 15
            ELAPSED=$((ELAPSED + 15))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Build timeout after $TIMEOUT seconds"
              exit 1
            fi
          done

          # Tag as latest
          gcloud container images add-tag \
            gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            --quiet

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "🚀 Deploying to Cloud Run..."

          # Escape the service account JSON for Cloud Run env var
          # Use FIREBASE_SERVICE_ACCOUNT_TAXASGE_DEV if available, fallback to GCP_SERVICE_ACCOUNT_KEY
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAXASGE_DEV }}" ]; then
            FIREBASE_SA_ESCAPED=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAXASGE_DEV }}' | jq -c .)
          else
            FIREBASE_SA_ESCAPED=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | jq -c .)
          fi

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=staging" \
            --set-env-vars="ENV=staging" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="DATABASE_MAX_CONNECTIONS=10" \
            --set-env-vars="DATABASE_MIN_CONNECTIONS=2" \
            --set-env-vars="REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars="JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
            --set-env-vars="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --set-env-vars="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --set-env-vars="SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --set-env-vars="SMTP_HOST=smtp.gmail.com" \
            --set-env-vars="SMTP_PORT=587" \
            --set-env-vars="SMTP_USERNAME=libressai@gmail.com" \
            --set-env-vars="SMTP_FROM_EMAIL=libressai@gmail.com" \
            --set-env-vars="SMTP_FROM_NAME=TaxasGE Platform" \
            --set-env-vars="SMTP_USE_TLS=true" \
            --set-env-vars="GITHUB_PAT=${{ secrets.GH_PAT }}" \
            --set-env-vars="CRON_SECRET=${{ secrets.CRON_SECRET }}" \
            --set-env-vars="RECEIPT_VERIFICATION_SECRET=${{ secrets.RECEIPT_VERIFICATION_SECRET }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars="GOOGLE_CLOUD_LOCATION=${{ env.REGION }}" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars="FIREBASE_STORAGE_BUCKET=${{ env.PROJECT_ID }}.firebasestorage.app" \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars="GEMINI_CHAT_MODEL=${{ secrets.GEMINI_CHAT_MODEL }}" \
            --set-env-vars="SENTRY_DSN=${{ secrets.SENTRY_DSN_BACKEND }}" \
            --set-env-vars="GIT_COMMIT_SHA=${{ github.sha }}" \
            --set-env-vars="GEMINI_PRO_MODEL=${{ secrets.GEMINI_CHAT_MODEL }}" \
            --set-env-vars="GEMINI_EMBEDDING_MODEL=text-embedding-005" \
            --set-env-vars="GRAFANA_BASE_URL=https://kouemousah.grafana.net" \
            --set-secrets="GRAFANA_SA_TOKEN=grafana-sa-token:latest" \
            --set-env-vars="^##^FIREBASE_SERVICE_ACCOUNT_TAXASGE_DEV=${FIREBASE_SA_ESCAPED}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --concurrency=80 \
            --command="uvicorn" \
            --args="app.main:app,--host,0.0.0.0,--port,8080,--workers,1"

          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Backend deployed to: $URL"

  # Job 3: Run Database Migrations (post-deploy)
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: pip install psycopg2-binary python-dotenv loguru

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🗄️ Running database migrations..."
          python -c "
          import os, sys, psycopg2
          from pathlib import Path

          DATABASE_URL = os.environ['DATABASE_URL']
          migrations_dir = Path('database/migrations')
          files = sorted(migrations_dir.glob('*.sql'))
          print(f'Found {len(files)} migration files')

          conn = psycopg2.connect(DATABASE_URL)
          conn.autocommit = True
          cur = conn.cursor()

          ok = err = 0
          for f in files:
              sql = f.read_text(encoding='utf-8')
              stmts = [s.strip() for s in sql.split(';') if s.strip() and not s.strip().startswith('--')]
              for stmt in stmts:
                  if not stmt:
                      continue
                  try:
                      cur.execute(stmt)
                  except Exception as e:
                      if 'already exists' in str(e) or 'duplicate' in str(e).lower():
                          pass  # Idempotent — skip silently
                      else:
                          print(f'  WARN {f.name}: {str(e)[:120]}')
                          err += 1
                          break
              else:
                  ok += 1

          cur.close()
          conn.close()
          print(f'✅ Migrations: {ok} OK, {err} warnings')
          "

  # Job 4: Generate Embeddings (RAG)
  embeddings:
    name: Generate RAG Embeddings
    runs-on: ubuntu-latest
    needs: [deploy, migrate]
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate embeddings via Cloud Run Job
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🤖 Creating Cloud Run Job for embedding generation..."

          gcloud run jobs delete populate-embeddings-staging \
            --region ${{ env.REGION }} \
            --quiet || echo "No existing job"

          gcloud run jobs create populate-embeddings-staging \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars="GOOGLE_CLOUD_LOCATION=${{ env.REGION }}" \
            --set-env-vars="GEMINI_EMBEDDING_MODEL=text-embedding-004" \
            --command="python" \
            --args="scripts/populate_embeddings.py,--batch-size,250" \
            --max-retries=1 \
            --task-timeout=30m \
            --memory=1Gi \
            --cpu=2 \
            --execute-now \
            --wait

          echo "✅ Embeddings generated!"

  # Job 4: Verify deployment
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy, embeddings]
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Health check
        run: |
          echo "🔍 Checking backend health..."
          URL="${{ needs.deploy.outputs.url }}"

          # Wait for service to be ready
          sleep 10

          # Health check with retry
          for i in 1 2 3; do
            if curl -sf "$URL/health" > /dev/null; then
              echo "✅ Health check passed!"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: API endpoints check
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          echo "📡 Checking API endpoints..."
          curl -sf "$URL/api/v1/chatbot/" || echo "Chatbot endpoint check"
          curl -sf "$URL/docs" || echo "Docs endpoint check"

      - name: Deployment summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           ✅ BACKEND STAGING DEPLOYMENT COMPLETE          ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║ Service:  ${{ env.SERVICE_NAME }}"
          echo "║ Region:   ${{ env.REGION }}"
          echo "║ URL:      ${{ needs.deploy.outputs.url }}"
          echo "║ Commit:   ${{ github.sha }}"
          echo "║ RAG:      ${{ needs.embeddings.result }}"
          echo "╚══════════════════════════════════════════════════════════╝"
