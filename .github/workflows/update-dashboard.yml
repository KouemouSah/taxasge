name: Update Dashboard Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 UTC
  push:
    branches: [develop]
    paths:
      - '.github/workflows/update-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Generate milestone data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/data

          # Fetch milestones
          gh api repos/${{ github.repository }}/milestones?state=all --paginate | \
            jq '[.[] | {
              number: .number,
              title: .title,
              state: .state,
              description: .description,
              open_issues: .open_issues,
              closed_issues: .closed_issues,
              due_on: .due_on,
              progress: (if (.open_issues + .closed_issues) > 0 then
                ((.closed_issues / (.open_issues + .closed_issues)) * 100 | floor)
              else 0 end)
            }] | sort_by(.number)' > docs/data/milestones.json

          echo "Generated milestones.json"

      - name: Generate repo stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repo metadata
          gh api repos/${{ github.repository }} | \
            jq '{
              name: .name,
              description: .description,
              stars: .stargazers_count,
              forks: .forks_count,
              open_issues: .open_issues_count,
              size_kb: .size,
              language: .language,
              default_branch: .default_branch,
              updated_at: .updated_at
            }' > docs/data/repo-stats.json

          # Commit count
          COMMIT_COUNT=$(gh api repos/${{ github.repository }}/commits?per_page=1 -i 2>/dev/null | grep -i 'link:' | grep -oP '(?<=page=)\d+(?=>; rel="last")' || echo "0")
          echo "{\"total_commits\": $COMMIT_COUNT, \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > docs/data/commits-stats.json

          echo "Generated repo-stats.json and commits-stats.json"

      - name: Generate workflow stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows | \
            jq '[.workflows[] | select(.state == "active") | {
              id: .id,
              name: .name,
              state: .state,
              path: .path
            }]' > docs/data/workflows.json

          echo "Generated workflows.json"

      - name: Generate issue stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh api repos/${{ github.repository }}/issues?state=open --paginate | jq 'length')
          CLOSED=$(gh api repos/${{ github.repository }}/issues?state=closed --paginate | jq 'length')

          echo "{\"open\": $OPEN, \"closed\": $CLOSED, \"total\": $(($OPEN + $CLOSED)), \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > docs/data/issues-stats.json

          echo "Generated issues-stats.json"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(docs): update dashboard data [skip ci]"
            git push
          fi
