# ============================================================================
# Facil Inspector — Build & Deploy (Android)
# ============================================================================
# Triggered on push to develop/main with inspector changes.
# Builds a release APK via Gradle (no EAS queue dependency).
# Uploads APK as GitHub artifact (downloadable from Actions tab).
#
# Required GitHub Secrets (optional — falls back to debug signing):
#   INSPECTOR_KEYSTORE_BASE64    — base64-encoded inspector-release.keystore
#   INSPECTOR_KEYSTORE_PASSWORD  — keystore password
#   INSPECTOR_KEY_ALIAS          — key alias
#   INSPECTOR_KEY_PASSWORD       — key password
# ============================================================================

name: Inspector Build

on:
  push:
    branches: [develop, main]
    paths:
      - 'packages/inspector/**'
      - '.github/workflows/inspector-build.yml'
  workflow_dispatch: # Manual trigger from GitHub UI

concurrency:
  group: inspector-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # --------------------------------------------------------------------------
  # TypeScript check (fast gate)
  # --------------------------------------------------------------------------
  typecheck:
    name: TS Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/inspector/package-lock.json
      - run: cd packages/inspector && npm ci
      - run: cd packages/inspector && npx tsc --noEmit

  # --------------------------------------------------------------------------
  # Build release APK
  # --------------------------------------------------------------------------
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/inspector/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: cd packages/inspector && npm ci

      - name: Create .env.production
        run: |
          cat > packages/inspector/.env.production << 'EOF'
          EXPO_PUBLIC_API_URL=https://taxasge-backend-staging-392159428433.us-central1.run.app
          EXPO_PUBLIC_API_TIMEOUT=30000
          EXPO_PUBLIC_FEATURE_BIOMETRIC=true
          EXPO_PUBLIC_FEATURE_PUSH=true
          EXPO_PUBLIC_FEATURE_OFFLINE=false
          EOF

      - name: Decode keystore
        if: ${{ env.INSPECTOR_KEYSTORE_BASE64 != '' }}
        env:
          INSPECTOR_KEYSTORE_BASE64: ${{ secrets.INSPECTOR_KEYSTORE_BASE64 }}
        run: |
          echo "$INSPECTOR_KEYSTORE_BASE64" | base64 -d > packages/inspector/android/app/inspector-release.keystore
          echo "Keystore decoded"

      - name: Build Release APK
        env:
          INSPECTOR_KEYSTORE_PASSWORD: ${{ secrets.INSPECTOR_KEYSTORE_PASSWORD }}
          INSPECTOR_KEY_ALIAS: ${{ secrets.INSPECTOR_KEY_ALIAS }}
          INSPECTOR_KEY_PASSWORD: ${{ secrets.INSPECTOR_KEY_PASSWORD }}
        run: |
          cd packages/inspector/android
          chmod +x gradlew

          # Pass signing config via Gradle properties
          GRADLE_PROPS=""
          if [ -f "app/inspector-release.keystore" ]; then
            GRADLE_PROPS="-PINSPECTOR_STORE_FILE=inspector-release.keystore"
            GRADLE_PROPS="$GRADLE_PROPS -PINSPECTOR_STORE_PASSWORD=$INSPECTOR_KEYSTORE_PASSWORD"
            GRADLE_PROPS="$GRADLE_PROPS -PINSPECTOR_KEY_ALIAS=$INSPECTOR_KEY_ALIAS"
            GRADLE_PROPS="$GRADLE_PROPS -PINSPECTOR_KEY_PASSWORD=$INSPECTOR_KEY_PASSWORD"
            echo "Using release keystore"
          else
            echo "No release keystore — using debug signing"
          fi

          echo "Building release APK..."
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            --max-workers=2 \
            -x lint \
            -x test \
            -PnewArchEnabled=false \
            $GRADLE_PROPS

          # Verify APK
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "APK built: $APK_SIZE"
          else
            echo "APK not found at expected path"
            find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facil-inspector-${{ github.ref_name }}-${{ github.sha }}
          path: packages/inspector/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        run: |
          APK_PATH="packages/inspector/android/app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "## Facil Inspector Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`facil-inspector-${{ github.ref_name }}-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
