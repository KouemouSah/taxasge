# ============================================================================
# Facil Inspector — EAS Cloud Build (Android)
# ============================================================================
# Triggers EAS Cloud builds on https://expo.dev. The runner only orchestrates;
# all native compilation happens on Expo's infrastructure.
#
# Why EAS instead of native Gradle on the runner:
#   - The previous Gradle path on ubuntu-latest kept hitting CMake 3.22 vs
#     3.31 conflicts under RN 0.81 New Architecture (run #24773564905,
#     2026-04-22). Patching the runner image is brittle. EAS Cloud has the
#     correct toolchain pinned and we get reproducible builds for free.
#   - Mirrors the mobile-eas-build.yml flow so both Expo apps share the
#     same release path (only the eas.json profile + the tag namespace
#     differ).
#
# Required Secret:
#   EXPO_TOKEN — Expo personal access token with build permissions
#                (shared with mobile-eas-build.yml, scope = the
#                @emacsah/facil organisation).
#
# Triggers:
#   - Manual dispatch (default profile: preview, Android only)
#   - Tag push inspector-v*.*.* → production profile
#
# How to ship a production Inspector build:
#   git tag inspector-v1.0.X && git push origin inspector-v1.0.X
#     → fires this workflow with profile=production
#     → Android .aab queued on EAS Cloud
#     → progress at https://expo.dev/accounts/emacsah/projects/<inspector-slug>/builds
# ============================================================================

name: Inspector EAS Build (Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [development, preview, production]
        default: preview
  push:
    tags:
      - 'inspector-v*.*.*'

concurrency:
  group: inspector-eas-${{ github.ref }}
  cancel-in-progress: false # never cancel a paid build mid-flight

env:
  NODE_VERSION: '20'
  WORKING_DIR: packages/inspector

jobs:
  eas-build:
    name: EAS Build (Inspector)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # orchestration only — actual build runs on Expo Cloud

    # Job-level env so EXPO_TOKEN is available to every step (TypeScript
    # check, eas build, future eas submit) without redeclaring it on each
    # `run:` block. Mirrors mobile-eas-build.yml after the 1267b964 hoist.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIR }} && npm ci --prefer-offline

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: TypeScript check
        run: cd ${{ env.WORKING_DIR }} && npx tsc --noEmit

      - name: Resolve build profile
        id: params
        run: |
          # Tag push inspector-v*.*.* → production. Manual dispatch → user input.
          if [[ "${{ github.ref }}" == refs/tags/inspector-v* ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          else
            echo "profile=${{ github.event.inputs.profile || 'preview' }}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS build (Android, ${{ steps.params.outputs.profile }})
        run: |
          cd ${{ env.WORKING_DIR }}
          eas build \
            --profile ${{ steps.params.outputs.profile }} \
            --platform android \
            --non-interactive \
            --no-wait
        # --no-wait returns immediately after the build is queued. Track
        # progress on https://expo.dev/accounts/emacsah/projects/<slug>/builds.
