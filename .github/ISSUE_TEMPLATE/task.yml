name: Task
description: Create a technical task aligned with ITIL/PMP methodology
title: "[Task]: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Create a structured task following ITIL/PMP best practices.

  - type: dropdown
    id: pmp_phase
    attributes:
      label: PMP Process Group
      options:
        - Initiating - Project charter, stakeholder identification
        - Planning - Scope, schedule, resource planning
        - Executing - Development, integration, quality
        - Monitoring & Controlling - Testing, QA, metrics
        - Closing - Deployment, documentation, lessons learned
    validations:
      required: true

  - type: dropdown
    id: itil_phase
    attributes:
      label: ITIL Service Lifecycle
      options:
        - Service Strategy
        - Service Design
        - Service Transition
        - Service Operation
        - Continual Service Improvement
    validations:
      required: true

  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - Backend API
        - Frontend Web
        - Mobile App
        - Inspector App
        - Database
        - Infrastructure / CI/CD
        - Documentation
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Definition of Done
      placeholder: |
        - [ ] Code implemented
        - [ ] Tests passing
        - [ ] i18n keys added (ES/FR/EN)
        - [ ] Documentation updated
        - [ ] CI/CD pipeline green
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What must be completed before this task?

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - XS (< 2 hours)
        - S (2-8 hours)
        - M (1-3 days)
        - L (1-2 weeks)
        - XL (> 2 weeks)
    validations:
      required: true
