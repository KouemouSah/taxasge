# ============================================================================
# 🚀 TaxasGE - Execute ts_vector Migration
# ============================================================================
# Purpose: Execute full-text search optimization migration on Supabase
# Trigger: Manual workflow dispatch only (for safety)
# Performance: Adds 10-100x faster search capabilities
# ============================================================================

name: 🚀 Execute ts_vector Migration

on:
  # Manual trigger only (for safety)
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "EXECUTE" to confirm migration'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================================================
  # JOB: Validate and Execute Migration
  # ==========================================================================
  execute-migration:
    name: 🔧 Execute ts_vector Migration
    runs-on: ubuntu-latest

    # Safety check
    if: github.event.inputs.confirm == 'EXECUTE'

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          cd packages/backend
          python -m pip install --upgrade pip
          pip install asyncpg python-dotenv loguru
          echo "✅ Dependencies installed"

      - name: ✅ Validate Migration File
        run: |
          MIGRATION_FILE="packages/backend/database/migrations/add_tsvector_to_fiscal_services.sql"

          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "❌ Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "✅ Migration file found"
          echo "📄 File: $MIGRATION_FILE"
          echo "📏 Size: $(wc -l < $MIGRATION_FILE) lines"

      - name: 🔍 Check Current Database State
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/backend

          python << 'EOF'
          import asyncio
          import asyncpg
          import os

          async def check_state():
              conn = await asyncpg.connect(os.getenv('DATABASE_URL'))

              # Check if column already exists
              column_exists = await conn.fetchval("""
                  SELECT COUNT(*)
                  FROM information_schema.columns
                  WHERE table_name = 'fiscal_services'
                  AND column_name = 'search_vector'
              """)

              if column_exists > 0:
                  print("⚠️  Column 'search_vector' already exists")
                  print("🔄 Migration may be re-applying or updating existing column")
              else:
                  print("✅ Column 'search_vector' does not exist (clean migration)")

              # Count fiscal_services rows
              row_count = await conn.fetchval("SELECT COUNT(*) FROM fiscal_services")
              print(f"📊 Current fiscal_services rows: {row_count}")

              await conn.close()

          asyncio.run(check_state())
          EOF

      - name: 🚀 Execute Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          cd packages/backend
          echo "🚀 Executing migration on $ENVIRONMENT environment..."
          python scripts/run_tsvector_migration.py

      - name: ✅ Verify Migration Success
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/backend

          python << 'EOF'
          import asyncio
          import asyncpg
          import os

          async def verify():
              conn = await asyncpg.connect(os.getenv('DATABASE_URL'))

              # Verify column
              column_exists = await conn.fetchval("""
                  SELECT COUNT(*)
                  FROM information_schema.columns
                  WHERE table_name = 'fiscal_services'
                  AND column_name = 'search_vector'
              """)

              # Verify index
              index_exists = await conn.fetchval("""
                  SELECT COUNT(*)
                  FROM pg_indexes
                  WHERE tablename = 'fiscal_services'
                  AND indexname = 'idx_fiscal_services_search_vector'
              """)

              # Verify trigger
              trigger_exists = await conn.fetchval("""
                  SELECT COUNT(*)
                  FROM pg_trigger
                  WHERE tgname = 'fiscal_services_search_vector_trigger'
              """)

              # Count populated rows
              populated_count = await conn.fetchval("""
                  SELECT COUNT(*)
                  FROM fiscal_services
                  WHERE search_vector IS NOT NULL
              """)

              await conn.close()

              # Check results
              if column_exists == 0:
                  print("❌ FAILED: Column not created")
                  exit(1)
              if index_exists == 0:
                  print("❌ FAILED: Index not created")
                  exit(1)
              if trigger_exists == 0:
                  print("❌ FAILED: Trigger not created")
                  exit(1)
              if populated_count == 0:
                  print("⚠️  WARNING: No rows populated")

              print("✅ All migration components verified successfully!")
              print(f"📊 {populated_count} rows with search_vector populated")

          asyncio.run(verify())
          EOF

      - name: 📊 Performance Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/backend

          python << 'EOF'
          import asyncio
          import asyncpg
          import os
          import time

          async def performance_test():
              conn = await asyncpg.connect(os.getenv('DATABASE_URL'))

              print("🧪 Running performance comparison...")
              print("")

              # Test 1: ILIKE search (old method)
              start = time.time()
              ilike_results = await conn.fetch("""
                  SELECT id, name_es
                  FROM fiscal_services
                  WHERE name_es ILIKE '%permiso%'
                  LIMIT 10
              """)
              ilike_time = (time.time() - start) * 1000

              print(f"📊 ILIKE search: {ilike_time:.2f}ms ({len(ilike_results)} results)")

              # Test 2: ts_vector search (new method)
              start = time.time()
              tsvector_results = await conn.fetch("""
                  SELECT id, name_es, ts_rank(search_vector, query) AS rank
                  FROM fiscal_services, to_tsquery('spanish', 'permiso') query
                  WHERE search_vector @@ query
                  ORDER BY rank DESC
                  LIMIT 10
              """)
              tsvector_time = (time.time() - start) * 1000

              print(f"⚡ ts_vector search: {tsvector_time:.2f}ms ({len(tsvector_results)} results)")

              # Calculate improvement
              if tsvector_time > 0:
                  improvement = (ilike_time / tsvector_time)
                  print(f"")
                  print(f"🚀 Performance improvement: {improvement:.1f}x faster")

              await conn.close()

          asyncio.run(performance_test())
          EOF

      - name: 📢 Summary
        if: success()
        run: |
          echo "="
          echo "🎉 Migration Completed Successfully!"
          echo "="
          echo ""
          echo "✅ Full-text search optimization applied to fiscal_services table"
          echo "⚡ Expected performance: 10-100x faster searches"
          echo "🔧 search_vector column created with GIN index"
          echo "🔄 Auto-update trigger configured"
          echo ""
          echo "Next steps:"
          echo "1. The search endpoint will now use ts_vector automatically"
          echo "2. Monitor search performance in production"
          echo "3. Consider updating other searchable tables"
          echo ""

      - name: 📢 Notification on Failure
        if: failure()
        run: |
          echo "="
          echo "❌ Migration Failed!"
          echo "="
          echo ""
          echo "Please review the logs above for details"
          echo "Common issues:"
          echo "- Database connection problems"
          echo "- Migration already applied"
          echo "- Insufficient permissions"
          echo ""

# ============================================================================
# CONCURRENCY CONTROL
# ============================================================================
concurrency:
  group: tsvector-migration-${{ github.event.inputs.environment }}
  cancel-in-progress: false  # Never cancel migrations mid-execution
