# Grafana dashboard provider — auto-load every JSON in /var/lib/grafana/dashboards
#
# When self-hosted, Grafana picks up new/modified dashboard JSONs every
# `updateIntervalSeconds` without restart.
#
# For Grafana Cloud (current default), this YAML is informational —
# Cloud doesn't read provisioning files. Use the API push script.
#
# Reference: .claude/plans/GRAFANA_E1_MASTER_PLAN.md §5.2

apiVersion: 1

providers:
  - name: facil-business-kpis
    orgId: 1
    folder: 'Facil — Business KPIs'              # Grafana folder shown in left nav
    folderUid: facil-business-kpis-folder
    type: file
    disableDeletion: true                        # provisioned = no delete via UI
    updateIntervalSeconds: 30
    allowUiUpdates: false                        # source of truth = git, not UI
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false           # all dashboards in same folder
